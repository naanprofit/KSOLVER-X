[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksolverx"
version = "0.1.0"
description = "Distributed ECDLP search pipeline"
authors = [{name = "AutoGenerated"}]
requires-python = ">=3.11"
dependencies = [
    "coincurve>=18.0.0",
    "xxhash",
    "murmurhash3",
    "sympy",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
pythonpath = ["src"]
